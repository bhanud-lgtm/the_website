    <meta charset="UTF-8">

    <title>Add Student - Adarsh Public School</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>


<!-- ==============================
     NAVBAR
================================ -->

    <div class="logo">
        <h2>Adarsh Public School</h2>

    <nav>

        <a href="/">Home</a>

        <a href="/about">About</a>

        <a href="/events">Events</a>

        <a href="/defaulters">Students</a>

        <a href="/admin">Admin</a>

        <a href="/logout">Logout</a>

    </nav>

</header>



<!-- ==============================
     PAGE HEADER
================================ -->

<section class="page-header">

    <p class="section-small">
        ADMINISTRATION
    </p>

    <h1>
        Add Student Record
    </h1>

    <p>
        Add a student's pending fee record.
    </p>

</section>



<!-- ==============================
     STUDENT FORM
================================ -->

<section class="admin-container">

    <div class="admin-card">

        <h2>
            👨‍🎓 Student Details
        </h2>


        <form action="/add-defaulter" method="POST">


            <label>
                Student Name
            </label>

            <input
                type="text"
                name="student_name"
                placeholder="Enter student name"
                required
            >


            <label>
                Class
            </label>

            <input
                type="text"
                name="class_name"
                placeholder="Example: 8th"
                required
            >


            <label>
                Roll Number
            </label>

            <input
                type="text"
                name="roll_number"
                placeholder="Enter roll number"
            >


            <label>
                Due Amount
            </label>

            <input
                type="number"
                name="due_amount"
                placeholder="Enter pending amount"
                min="0"
                required
            >


            <label>
                Due Date
            </label>

            <input
                type="date"
                name="due_date"
            >


            <label>
                Reason
            </label>

            <textarea
                name="reason"
                placeholder="Enter reason"
                rows="4"
            ></textarea>


            <button type="submit">
                Add Student
            </button>


        </form>

    </div>

</section>
