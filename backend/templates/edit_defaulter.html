<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student - Adarsh Public School</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<header class="navbar">

    <div class="logo">
        <h2>Adarsh Public School</h2>
    </div>

    <nav>
        <a href="/">Home</a>
        <a href="/events">Events</a>
        <a href="/defaulters">Defaulters</a>
        <a href="/admin">Admin</a>
    </nav>

</header>


<section class="page-header">

    <p class="section-small">
        ADMINISTRATION
    </p>

    <h1>
        Edit Student
    </h1>

    <p>
        Update the student's pending fee details.
    </p>

</section>


<section class="admin-container">

    <div class="admin-card">

        <h2>
            Update Student
        </h2>

        <form action="/update-defaulter/{{ student['id'] }}" method="POST">

            <label>
                Student Name
            </label>

            <input
                type="text"
                name="student_name"
                value="{{ student['student_name'] }}"
                required
            >


            <label>
                Class
            </label>

            <input
                type="text"
                name="class_name"
                value="{{ student['class_name'] }}"
                required
            >


            <label>
                Roll Number
            </label>

            <input
                type="text"
                name="roll_number"
                value="{{ student['roll_number'] or '' }}"
            >


            <label>
                Due Amount
            </label>

            <input
                type="number"
                name="due_amount"
                value="{{ student['due_amount'] }}"
                min="0"
                required
            >


            <label>
                Due Date
            </label>

            <input
                type="date"
                name="due_date"
                value="{{ student['due_date'] or '' }}"
            >


            <label>
                Reason
            </label>

            <textarea
                name="reason"
                rows="4"
            >{{ student['reason'] or '' }}</textarea>


            <button type="submit">
                Update Student
            </button>

        </form>

    </div>

</section>


<footer>

    <h3>
        Adarsh Public School
    </h3>

    <p>
        Bhadva Bhainslana Road, Near Jaal ke Balaji
    </p>

    <p>
        Contact: 9829473980
    </p>

    <p class="copyright">
        © 2026 Adarsh Public School. All Rights Reserved.
    </p>

</footer>

</body>
</html>
