<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Event - Adarsh Public School</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>


<!-- ==============================
     NAVBAR
================================ -->

<header class="navbar">

    <div class="logo">
        <h2>Adarsh Public School</h2>
    </div>

    <nav>

        <a href="/">Home</a>

        <a href="/about">About</a>

        <a href="/events">Events</a>

        <a href="/defaulters">Students</a>

        <a href="/admin">Admin</a>

        <a href="/logout">Logout</a>

    </nav>

</header>



<!-- ==============================
     PAGE HEADER
================================ -->

<section class="page-header">

    <p class="section-small">
        ADMINISTRATION
    </p>

    <h1>
        Edit Event
    </h1>

    <p>
        Update the event details below.
    </p>

</section>



<!-- ==============================
     EDIT EVENT FORM
================================ -->

<section class="admin-container">

    <div class="admin-card">

        <h2>
            📅 Update Event
        </h2>


        <form action="/update-event/{{ event['id'] }}"
              method="POST">


            <label>
                Event Title
            </label>

            <input
                type="text"
                name="title"
                value="{{ event['title'] }}"
                required
            >


            <label>
                Event Date
            </label>

            <input
                type="date"
                name="event_date"
                value="{{ event['event_date'] }}"
                required
            >


            <label>
                Description
            </label>

            <textarea
                name="description"
                rows="5"
                placeholder="Enter event description"
            >{{ event['description'] or '' }}</textarea>


            <button type="submit">
                Update Event
            </button>


        </form>

    </div>

</section>

    </p>

</footer>


</body>

</html>
